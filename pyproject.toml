[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "causal-ui-gym"
version = "0.1.0"
description = "Pure-Python gym for testing agent causal reasoning in UI-like decision tasks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_ui_gym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
